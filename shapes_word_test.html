<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かたち 単語テスト | えいごのせんせいラボ</title>
<style>
  :root {
    --sky: #1e5fd9;
    --sky-deep: #12409e;
    --gold: #ffd23f;
    --white: #ffffff;
    --correct: #34c759;
    --wrong: #ff4d4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", sans-serif;
    background: linear-gradient(180deg, var(--sky-deep) 0%, var(--sky) 60%, #3a7fe8 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    color: var(--gold);
    font-size: 14px;
    opacity: 0.8;
  }
  h1 {
    font-size: 22px;
    margin: 6px 0 2px;
    text-align: center;
    z-index: 1;
  }
  .subtitle {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 14px;
    z-index: 1;
  }
  .journey {
    width: 100%;
    max-width: 720px;
    background: rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 14px 14px 20px;
    margin-bottom: 16px;
    z-index: 1;
  }
  .journey-track {
    position: relative;
    height: 46px;
    margin: 6px 0 4px;
  }
  .track-line {
    position: absolute;
    top: 50%;
    left: 4%;
    right: 4%;
    height: 4px;
    background: rgba(255,255,255,0.3);
    border-radius: 4px;
    transform: translateY(-50%);
  }
  .track-fill {
    position: absolute;
    top: 50%;
    left: 4%;
    height: 4px;
    background: var(--gold);
    border-radius: 4px;
    transform: translateY(-50%);
    width: 0%;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }
  .rocket {
    position: absolute;
    top: 50%;
    left: 4%;
    font-size: 26px;
    transform: translate(-50%, -50%) rotate(90deg);
    transition: left 0.6s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));
  }
  .moon {
    position: absolute;
    top: 50%;
    right: 2%;
    font-size: 30px;
    transform: translateY(-50%);
  }
  .journey-label {
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    opacity: 0.95;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 18px;
    z-index: 1;
    text-align: center;
  }
  .qcount {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 8px;
  }
  .speaker-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .speaker-btn {
    background: var(--gold);
    color: #1e3a8a;
    border: none;
    border-radius: 50%;
    width: 64px;
    height: 64px;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 0 #c9a20f;
    transition: transform 0.1s;
  }
  .speaker-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9a20f; }
  .word-hint {
    font-size: 15px;
    opacity: 0.9;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 600px) {
    .choices {
      grid-template-columns: 1fr 1fr;
    }
  }
  .choice img {
    max-height: 22vh;
    object-fit: contain;
  }
  .choice {
    background: #fff;
    border: 4px solid transparent;
    border-radius: 14px;
    padding: 8px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
  }
  .choice:active { transform: scale(0.97); }
  .choice img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }
  .choice.correct { border-color: var(--correct); }
  .choice.wrong { border-color: var(--wrong); animation: shake 0.4s; }
  .choice.disabled { pointer-events: none; opacity: 0.6; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .status-msg {
    min-height: 22px;
    font-size: 15px;
    font-weight: bold;
    margin-top: 12px;
  }
  .status-msg.ok { color: #b6ffb0; }
  .status-msg.ng { color: #ffb3b3; }

  .finish-screen {
    display: none;
    width: 100%;
    max-width: 720px;
    text-align: center;
    z-index: 1;
  }
  .finish-screen.show { display: block; }
  .card.hide { display: none; }
  .journey.hide { display: none; }
  .moon-landing {
    font-size: 70px;
    margin: 10px 0;
    animation: pop 0.6s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .finish-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .finish-sub {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 18px;
  }
  .restart-btn {
    background: var(--gold);
    color: #1e3a8a;
    border: none;
    border-radius: 30px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #c9a20f;
  }
  .capture-btn {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 24px;
    padding: 9px 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .capture-btn:active { transform: translateY(1px); }
  .confetti {
    position: fixed;
    top: -20px;
    font-size: 20px;
    animation: fall linear forwards;
    z-index: 2;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }
  .start-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, var(--sky-deep) 0%, var(--sky) 60%, #3a7fe8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .start-overlay h2 {
    font-size: 22px;
    margin-bottom: 10px;
  }
  .start-overlay p {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 24px;
    max-width: 320px;
  }
  .start-btn {
    background: var(--gold);
    color: #1e3a8a;
    border: none;
    border-radius: 30px;
    padding: 16px 40px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #c9a20f;
  }
  .sound-warning {
    display: none;
    background: rgba(255, 77, 79, 0.2);
    border: 1px solid var(--wrong);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    margin-top: 10px;
    max-width: 480px;
  }
  .sound-warning.show { display: block; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="start-overlay" id="startOverlay">
  <h2>🚀 かたち 単語テスト</h2>
  <p>ボタンを おして スタート！</p>
  <button class="start-btn" id="startBtn">▶ はじめる</button>
</div>

<h1>🔺 かたち 単語テスト</h1>
<div class="subtitle">きこえた かたち を えらぼう</div>

<div class="journey" id="journey">
  <div class="journey-track">
    <div class="track-line"></div>
    <div class="track-fill" id="trackFill"></div>
    <div class="rocket" id="rocket">🚀</div>
    <div class="moon">🌕</div>
  </div>
  <div class="journey-label" id="journeyLabel">0 / 21 マスター</div>
</div>

<div class="card" id="quizCard">
  <div class="qcount" id="qcount">問題 1 / 21</div>
  <div class="speaker-row">
    <button class="speaker-btn" id="speakerBtn" aria-label="もう一度きく">🔊</button>
  </div>
  <div class="choices" id="choices"></div>
  <div class="status-msg" id="statusMsg"></div>
</div>

<div class="finish-screen" id="finishScreen">
  <div class="moon-landing">🌕🚀</div>
  <div class="finish-title">ちゃくりく せいこう！</div>
  <div class="finish-sub">ぜんぶ の たんご を マスターしました！</div>
  <button class="restart-btn" id="restartBtn">もういちど ちょうせん</button>
  <div style="margin-top:14px;">
    <button class="capture-btn" id="captureBtn">📸 この画面をキャプチャする</button>
  </div>
</div>

<script>
(function() {
  const ALL_WORDS = JSON.parse(document.getElementById('colorData').textContent);
  const CONFUSABLE_GROUPS = [["square", "rectangle", "diamond"]]; // 同じグループ内の単語は同じ問題の選択肢に並ばないようにする
  const SFX = JSON.parse(document.getElementById('sfxData').textContent);
  const sfxCorrect = new Audio(SFX.correct);
  const sfxWrong = new Audio(SFX.wrong);
  const sfxLevelup = new Audio(SFX.levelup);
  const TOTAL = ALL_WORDS.length;
  const byWord = {};
  ALL_WORDS.forEach(w => byWord[w.word] = w);

  // ---- stars background ----
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = '★';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.fontSize = (8 + Math.random()*10) + 'px';
    s.style.opacity = 0.3 + Math.random()*0.5;
    starsEl.appendChild(s);
  }

  // ---- state ----
  let mastered = new Set();
  let queue = [];
  let currentWord = null;
  let locked = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startNewRound(words) {
    queue = shuffle(words);
    nextQuestion();
  }

  function updateProgress() {
    const pct = mastered.size / TOTAL;
    const trackSpan = 92; // track runs from 4% to 96% of container width
    const fillPct = pct * trackSpan;
    document.getElementById('trackFill').style.width = fillPct + '%';
    document.getElementById('rocket').style.left = (4 + fillPct) + '%';
    document.getElementById('journeyLabel').textContent = mastered.size + ' / ' + TOTAL + ' マスター';
  }

  let cachedVoice = null;
  const audioCache = {};
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;
    return voices.find(v => v.lang === 'en-US') ||
           voices.find(v => v.lang && v.lang.startsWith('en')) ||
           voices[0];
  }

  function speak(word) {
    // 収録済みのMP3を優先して再生（端末やブラウザによる差が出にくい）
    const dataUrl = byWord[word] && byWord[word].audio;
    if (dataUrl) {
      let audio = audioCache[word];
      if (!audio) {
        audio = new Audio(dataUrl);
        audioCache[word] = audio;
      }
      audio.currentTime = 0;
      audio.play().catch(() => {
        // 再生できない場合はブラウザの読み上げにフォールバック
        speakWithSynthesis(word);
      });
      return;
    }
    speakWithSynthesis(word);
  }

  function speakWithSynthesis(word) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word.replace(/_/g, ' '));
    u.lang = 'en-US';
    u.rate = 0.85;
    if (!cachedVoice) cachedVoice = pickVoice();
    if (cachedVoice) u.voice = cachedVoice;
    window.speechSynthesis.speak(u);
  }

  function nextQuestion() {
    if (queue.length === 0) {
      const remaining = ALL_WORDS.filter(w => !mastered.has(w.word));
      if (remaining.length === 0) {
        finish();
        return;
      }
      startNewRound(remaining.map(w => w.word));
      return;
    }
    locked = false;
    currentWord = queue.shift();
    const correct = byWord[currentWord];

    // 現在の単語と同じ「紛らわしいグループ」に属する単語を除外してから distractor を選ぶ
    const sameGroup = new Set([currentWord]);
    CONFUSABLE_GROUPS.forEach(group => {
      if (group.includes(currentWord)) {
        group.forEach(w => sameGroup.add(w));
      }
    });
    const pool = ALL_WORDS.filter(w => !sameGroup.has(w.word));
    const others = shuffle(pool).slice(0, 3);
    const options = shuffle([correct, ...others]);

    document.getElementById('qcount').textContent =
      '問題 ' + (mastered.size + 1) + ' / ' + TOTAL;
    document.getElementById('statusMsg').textContent = '';
    document.getElementById('statusMsg').className = 'status-msg';

    const choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('div');
      btn.className = 'choice';
      btn.innerHTML = '<img src="' + opt.img + '" alt="">';
      btn.addEventListener('click', () => handleAnswer(opt.word, btn, choicesEl));
      choicesEl.appendChild(btn);
    });

    speak(currentWord);
  }

  function handleAnswer(selectedWord, btnEl, choicesEl) {
    if (locked) return;
    locked = true;
    const isCorrect = selectedWord === currentWord;
    const statusEl = document.getElementById('statusMsg');

    [...choicesEl.children].forEach(c => c.classList.add('disabled'));

    if (isCorrect) {
      btnEl.classList.add('correct');
      statusEl.textContent = 'せいかい！';
      statusEl.className = 'status-msg ok';
      mastered.add(currentWord);
      updateProgress();
      sfxCorrect.currentTime = 0;
      sfxCorrect.play().catch(() => {});
    } else {
      btnEl.classList.add('wrong');
      statusEl.textContent = 'もういちど ちょうせん しよう';
      statusEl.className = 'status-msg ng';
      queue.push(currentWord);
      sfxWrong.currentTime = 0;
      sfxWrong.play().catch(() => {});
    }

    setTimeout(nextQuestion, isCorrect ? 1000 : 1200);
  }

  function finish() {
    document.getElementById('quizCard').classList.add('hide');
    document.getElementById('journey').classList.add('hide');
    document.getElementById('finishScreen').classList.add('show');
    sfxLevelup.currentTime = 0;
    sfxLevelup.play().catch(() => {});
    launchConfetti();
  }

  function launchConfetti() {
    const emojis = ['🎉','✨','⭐','🎊'];
    for (let i = 0; i < 24; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        c.style.left = Math.random()*100 + '%';
        c.style.animationDuration = (2 + Math.random()*1.5) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }, i * 80);
    }
  }

  document.getElementById('speakerBtn').addEventListener('click', () => {
    if (currentWord) speak(currentWord);
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    mastered = new Set();
    updateProgress();
    document.getElementById('quizCard').classList.remove('hide');
    document.getElementById('journey').classList.remove('hide');
    document.getElementById('finishScreen').classList.remove('show');
    startNewRound(ALL_WORDS.map(w => w.word));
  });

  document.getElementById('captureBtn').addEventListener('click', () => {
    const btn = document.getElementById('captureBtn');
    const target = document.getElementById('finishScreen');
    btn.style.visibility = 'hidden';
    html2canvas(target, { backgroundColor: '#1e5fd9', scale: 2 }).then(canvas => {
      btn.style.visibility = 'visible';
      const link = document.createElement('a');
      link.download = 'かたち単語テスト_けっか.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(() => {
      btn.style.visibility = 'visible';
      alert('キャプチャに しっぱいしました。もう一度 おしてください。');
    });
  });

  // voice preload
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickVoice(); };
    cachedVoice = pickVoice();
  }

  // init (wait for user tap before starting, so audio is allowed to play)
  updateProgress();

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').style.display = 'none';
    startNewRound(ALL_WORDS.map(w => w.word));
  });
})();
</script>

</body>
</html>
