<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数たんごミニテスト</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: #fdf6e3;
    margin: 0;
    padding: 20px;
    color: #333;
  }
  h1 {
    text-align: center;
    color: #2e7d32;
    font-size: 1.6em;
    margin-bottom: 4px;
  }
  .sub {
    text-align: center;
    color: #666;
    margin-bottom: 16px;
    font-size: 0.95em;
  }
  #scoreResult {
    text-align: center;
    font-size: 1.15em;
    font-weight: bold;
    padding: 14px;
    margin: 0 auto 20px auto;
    max-width: 600px;
    border-radius: 12px;
    display: none;
  }
  #scoreResult.perfect {
    display: block;
    background: #dff6dd;
    color: #1b5e20;
    border: 2px solid #66bb6a;
  }
  #scoreResult.retry {
    display: block;
    background: #fff3e0;
    color: #e65100;
    border: 2px solid #ffb74d;
  }
  .question {
    max-width: 640px;
    margin: 0 auto 28px auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .qlabel {
    font-weight: bold;
    color: #2e7d32;
    margin-bottom: 8px;
    font-size: 1.05em;
  }
  .playBtn {
    display: block;
    margin: 0 auto 16px auto;
    background: #43a047;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 10px 26px;
    font-size: 1em;
    cursor: pointer;
  }
  .playBtn:active { background: #2e7d32; }
  .choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
  }
  .choice {
    border: 3px solid #ddd;
    border-radius: 12px;
    padding: 6px;
    cursor: pointer;
    text-align: center;
    background: #fafafa;
    transition: border-color 0.15s;
  }
  .choice img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
  .choice.selected {
    border-color: #42a5f5;
    background: #e3f2fd;
  }
  .choice.wrong {
    border-color: #e53935;
    background: #ffebee;
  }
  #gradeBtnWrap {
    text-align: center;
    margin: 30px auto;
  }
  #gradeBtn {
    background: #ff7043;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 14px 40px;
    font-size: 1.15em;
    cursor: pointer;
  }
  #gradeBtn:active { background: #e64a19; }
</style>
</head>
<body>

<h1>すうじ たんご ミニテスト</h1>
<div class="sub">おとを きいて、ただしい すうじを えらぼう！</div>

<div id="scoreResult"></div>

<div id="quizArea"></div>

<div id="gradeBtnWrap">
  <button id="gradeBtn">さいてん する</button>
</div>

const QUESTIONS = [{"answer": "3", "choices": ["20", "5", "11", "3", "4"]}, {"answer": "4", "choices": ["5", "13", "3", "4", "17"]}, {"answer": "5", "choices": ["9", "3", "17", "12", "5"]}, {"answer": "8", "choices": ["20", "3", "8", "13", "11"]}, {"answer": "9", "choices": ["12", "8", "9", "3", "5"]}, {"answer": "11", "choices": ["3", "11", "9", "12", "20"]}, {"answer": "12", "choices": ["12", "11", "20", "17", "9"]}, {"answer": "13", "choices": ["13", "8", "4", "12", "9"]}, {"answer": "15", "choices": ["15", "11", "17", "20", "5"]}, {"answer": "17", "choices": ["8", "20", "5", "17", "4"]}, {"answer": "20", "choices": ["20", "12", "3", "8", "11"]}];

let currentAudio = null;
let audioTimeoutId = null;

function stopAllAudio() {
  if (currentAudio) {
    currentAudio.onended = null;
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  if (audioTimeoutId) {
    clearTimeout(audioTimeoutId);
    audioTimeoutId = null;
  }
}

function playAudio(word) {
  stopAllAudio();
  const src = "data:audio/mp3;base64," + DATA[word].audio;
  const audio1 = new Audio(src);
  currentAudio = audio1;
  audio1.onended = function() {
    audio1.onended = null;
    audioTimeoutId = setTimeout(function() {
      const audio2 = new Audio(src);
      currentAudio = audio2;
      audio2.play();
    }, 500);
  };
  audio1.play();
}

const answers = {};

function selectChoice(qIndex, word, cardEl) {
  const container = document.getElementById("choices-" + qIndex);
  container.querySelectorAll(".choice").forEach(function(c) {
    c.classList.remove("selected");
  });
  cardEl.classList.add("selected");
  answers[qIndex] = word;
}

function buildQuiz() {
  const quizArea = document.getElementById("quizArea");
  QUESTIONS.forEach(function(q, qIndex) {
    const qDiv = document.createElement("div");
    qDiv.className = "question";

    const label = document.createElement("div");
    label.className = "qlabel";
    label.textContent = "もんだい " + (qIndex + 1);
    qDiv.appendChild(label);

    const playBtn = document.createElement("button");
    playBtn.className = "playBtn";
    playBtn.textContent = "🔊 きく";
    playBtn.onclick = function() { playAudio(q.answer); };
    qDiv.appendChild(playBtn);

    const choicesDiv = document.createElement("div");
    choicesDiv.className = "choices";
    choicesDiv.id = "choices-" + qIndex;

    q.choices.forEach(function(word) {
      const card = document.createElement("div");
      card.className = "choice";
      card.dataset.word = word;

      const img = document.createElement("img");
      img.src = "data:image/png;base64," + DATA[word].img;
      card.appendChild(img);

      card.onclick = function() { selectChoice(qIndex, word, card); };

      choicesDiv.appendChild(card);
    });

    qDiv.appendChild(choicesDiv);
    quizArea.appendChild(qDiv);
  });
}

let hasGradedOnce = false;

function gradeAll() {
  let correctCount = 0;

  QUESTIONS.forEach(function(q, qIndex) {
    const container = document.getElementById("choices-" + qIndex);
    container.querySelectorAll(".choice").forEach(function(c) {
      c.classList.remove("wrong");
    });

    const userAnswer = answers[qIndex];
    if (userAnswer === q.answer) {
      correctCount++;
    } else if (userAnswer) {
      const wrongCard = container.querySelector('.choice[data-word="' + userAnswer + '"]');
      if (wrongCard) wrongCard.classList.add("wrong");
    }
  });

  const resultDiv = document.getElementById("scoreResult");
  resultDiv.classList.remove("perfect", "retry");

  if (correctCount === QUESTIONS.length) {
    resultDiv.classList.add("perfect");
    resultDiv.textContent = "ぜんもん せいかいだよ。正しく おぼえたね！（" + correctCount + " / " + QUESTIONS.length + "）";
  } else {
    resultDiv.classList.add("retry");
    resultDiv.textContent = "まちがえた もんだいを もういちど きき直して、とき直そう（" + correctCount + " / " + QUESTIONS.length + "）";
  }

  window.scrollTo({ top: 0, behavior: "smooth" });

  if (hasGradedOnce) {
    document.getElementById("gradeBtn").textContent = "もういちど さいてん する";
  } else {
    hasGradedOnce = true;
    document.getElementById("gradeBtn").textContent = "もういちど さいてん する";
  }
}

document.getElementById("gradeBtn").onclick = gradeAll;

buildQuiz();
</script>
